<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
    <title>Check-on</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            /* Tangled palette: 라벤더 드레스 · 등불 골드 · 크림 캔버스 · 꽃분홍 */
            --bg: #fbf7f0;
            --tile: #f2ebf5;
            --block: #251b36;       /* 등불이 뜨는 보랏빛 밤하늘 */
            --gold: #f2b33d;
            --gold-soft: rgba(255, 176, 64, 0.55);
            --on-block: #ffffff;
            --ink: #231a2e;
            --ink-2: #5c5068;
            --ink-3: #968aa3;
            --rule: #e3dbe6;
            --primary: #6d3fa6;
            --primary-press: #5a3290;
            --on-primary: #ffffff;
            --pink: #f3a6c0;

            --font-display: "Barlow Semi Condensed", "Pretendard Variable", Pretendard, system-ui, sans-serif;
            --font-sans: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
            --font-mono: var(--font-display);
            --font-fable: "Cormorant Garamond", "Pretendard Variable", serif;

            /* JS 문자열 호환 */
            --apple-blue: var(--primary);
            --apple-text: var(--ink);
            --apple-gray: var(--ink-2);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #15101d;
                --tile: #1f1829;
                --block: #0f0a17;
                --ink: #f4eff8;
                --ink-2: #bcb0c8;
                --ink-3: #7e7289;
                --rule: #2e2539;
                --primary: #8f63cf;
                --primary-press: #7a4fbd;
            }
        }

        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: var(--pink); color: var(--ink); }
        .display { font-family: var(--font-display); letter-spacing: -0.005em; }
        .mono, .num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
        .eyebrow { font-family: var(--font-display); font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
        .t-strong { font-family: var(--font-display); font-weight: 600; color: var(--primary); font-size: 1.15em; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* Dot motif */
        .dot { display: inline-block; width: .42em; height: .42em; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold-soft); vertical-align: .05em; }

        /* ---------- Controls ---------- */
        .field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .apple-input {
            width: 100%; height: 52px; padding: 0 16px;
            border: 1px solid var(--rule); border-radius: 0;
            background: var(--bg); color: var(--ink);
            font: inherit; font-size: 16px; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .apple-input::placeholder { color: var(--ink-3); }
        .apple-input:hover { border-color: var(--ink-3); }
        .apple-input:focus { border-color: var(--ink); box-shadow: inset 0 -2px 0 var(--primary); }

        .btn {
            height: 48px; padding: 0 20px;
            display: inline-flex; align-items: center; justify-content: space-between; gap: 12px;
            border-radius: 0; font: inherit; font-size: 15px; font-weight: 600;
            transition: background-color .15s, color .15s, border-color .15s;
            cursor: pointer;
        }
        .btn-solid { background: var(--primary); color: var(--on-primary); border: 1px solid var(--primary); }
        .btn-solid:hover { background: var(--primary-press); border-color: var(--primary-press); }
        .btn-line { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
        .btn-line:hover { background: var(--ink); color: var(--bg); }
        .btn-center { justify-content: center; }
        .btn .arrow { transition: transform .2s ease; }
        .btn:hover .arrow { transform: translateX(4px); }

        /* 큰 CTA 블록 (출근/퇴근) */
        .cta {
            height: auto; min-height: 200px; width: 100%;
            flex-direction: column; align-items: stretch; justify-content: space-between;
            padding: 24px; text-align: left;
        }
        .cta .cta-top { display: flex; justify-content: space-between; align-items: center; }
        .cta .cta-kicker { font-family: var(--font-display); font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
        .cta .btn-meta { font-family: var(--font-display); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; opacity: .85; }
        .cta .cta-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
        .cta .btn-label { font-family: var(--font-display); font-size: 40px; font-weight: 400; line-height: 1; letter-spacing: -0.01em; }
        .cta .arrow { width: 36px; height: 36px; }
        .cta.btn-line .cta-kicker, .cta.btn-line .btn-meta { color: inherit; }
        .cta { position: relative; overflow: hidden; isolation: isolate; }
        .cta > span { position: relative; z-index: 1; }
        .cta-emblem {
            position: absolute; z-index: 0; pointer-events: none;
            width: 340px; height: 340px; right: -110px; top: 50%; margin-top: -170px;
            color: var(--gold); opacity: .5;
            animation: slowspin 90s linear infinite;
            transition: opacity .3s;
        }
        .cta:hover .cta-emblem { opacity: .65; }
        .cta.btn-line .cta-emblem { color: var(--primary); opacity: .12; }
        .cta-flowers { position: absolute; inset: 0; z-index: 0; pointer-events: none; color: var(--pink); opacity: .35; }
        .cta.btn-line .cta-flowers { opacity: .25; }
        @keyframes slowspin { to { transform: rotate(360deg); } }

        /* 배경 친구들 캔버스 */
        #friendsCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 30; pointer-events: none; } /* 콘텐츠 위, 모달(40+) 아래. 클릭은 통과 */

        .link-btn { font-family: var(--font-display); font-size: 16px; font-weight: 500; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
        .link-btn svg { color: var(--primary); transition: transform .2s; }
        .link-btn:hover svg { transform: translateX(3px); }

        .badge { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
        .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
        .badge-live { color: var(--ink); }
        .badge-live::before { background: var(--gold); border-color: var(--gold); }

        .fable { font-family: var(--font-fable); font-style: italic; font-weight: 500; letter-spacing: -0.01em; }

        /* ---------- Hero (night block + lanterns) ---------- */
        .hero {
            position: relative; isolation: isolate; overflow: hidden;
            background: var(--block);
            color: var(--on-block);
        }
        /* 바닥에서 올라오는 아주 옅은 등불빛 */
        .hero::after {
            content: ""; position: absolute; inset: auto 0 0 0; height: 60%; z-index: -2; pointer-events: none;
            background: radial-gradient(ellipse 70% 90% at 50% 100%, rgba(255, 160, 60, 0.12), transparent 70%);
            transition: opacity .8s;
        }
        .hero[data-state="idle"]::after { opacity: .4; }
        .lanterns { position: absolute; inset: 0; z-index: -1; pointer-events: none; transition: opacity 1.2s ease; }
        .hero[data-state="idle"] .lanterns { opacity: .35; }
        .hero[data-state="done"] .lanterns { opacity: .6; }
        .lantern {
            position: absolute; bottom: -40px;
            width: var(--w); height: calc(var(--w) * 1.3);
            border-radius: 38% 38% 22% 22% / 30% 30% 18% 18%;
            background: #f7b04a;
            box-shadow: 0 0 calc(var(--w) * 1.6) var(--gold-soft), inset 0 calc(var(--w) * -0.25) calc(var(--w) * 0.4) rgba(170, 60, 0, 0.55);
            opacity: 0;
            animation: rise var(--dur) linear var(--delay) infinite, flicker 3.2s ease-in-out var(--delay) infinite;
        }
        @keyframes rise {
            0%   { transform: translate(0, 0); opacity: 0; }
            8%   { opacity: var(--o); }
            50%  { transform: translate(var(--sway), calc(var(--rise) * -0.5)); }
            88%  { opacity: var(--o); }
            100% { transform: translate(0, calc(var(--rise) * -1)); opacity: 0; }
        }
        @keyframes flicker { 0%, 100% { filter: brightness(1); } 45% { filter: brightness(1.18); } 60% { filter: brightness(.9); } }
        .hero .eyebrow { color: rgba(255,255,255,.55); }

        .status { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 16px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: rgba(255,255,255,.7); }
        .status::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); box-sizing: border-box; transition: all .3s; }
        .status[data-state="working"] { color: #fff; }
        .status[data-state="working"]::before { border: 0; background: var(--gold); animation: beat 1.6s ease-in-out infinite; }
        .status[data-state="done"]::before { border: 0; background: #fff; }
        @keyframes beat { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,179,61,.7); } 50% { box-shadow: 0 0 0 8px rgba(242,179,61,0); } }

        #liveClock {
            font-family: var(--font-display);
            font-size: clamp(104px, 24vw, 200px);
            font-weight: 400;
            line-height: .8;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            margin-left: -0.04em;
        }
        #liveClock .colon { color: var(--gold); text-shadow: 0 0 18px var(--gold-soft); animation: tick 1s steps(1) infinite; margin: 0 .01em; }
        #liveClock .sec { font-size: 22px; font-weight: 400; letter-spacing: .02em; color: rgba(255,255,255,.45); vertical-align: top; margin-left: 12px; position: relative; top: .35em; }
        @keyframes tick { 50% { opacity: .2; } }

        .track { position: relative; height: 4px; background: rgba(255,255,255,.14); }
        .track-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #fff; transition: width .6s cubic-bezier(.2,.8,.2,1); }
        .track-fill[data-state="working"] { background: var(--gold); box-shadow: 0 0 12px var(--gold-soft); }
        .ticks { display: grid; grid-template-columns: repeat(8, 1fr); margin-top: 10px; }
        .ticks span { font-family: var(--font-display); font-size: 12px; color: rgba(255,255,255,.4); border-left: 1px solid rgba(255,255,255,.18); padding-left: 5px; line-height: 1; }
        .ticks span:last-child { position: relative; }
        .ticks span:last-child::after { content: "8h"; position: absolute; right: 0; top: 0; }

        /* ---------- Figures band ---------- */
        .kv { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--tile); }
        .kv > div { padding: 20px 24px 22px; }
        .kv > div + div { border-left: 1px solid var(--rule); }
        .kv dt { font-family: var(--font-display); font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
        .kv dd { font-family: var(--font-display); font-size: 34px; font-weight: 400; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
        .kv dd.muted { color: var(--ink-3); }
        @media (max-width: 560px) {
            .kv > div { padding: 16px 14px 18px; }
            .kv dd { font-size: 24px; }
            .kv dt { font-size: 11px; letter-spacing: .06em; }
        }

        /* ---------- Tabs ---------- */
        .segmented-control { position: relative; display: inline-flex; gap: 32px; }
        .segment-btn { position: relative; padding: 14px 0; font-family: var(--font-display); font-size: 20px; font-weight: 500; color: var(--ink-3); transition: color .15s; }
        .segment-btn:hover, .segment-btn.active { color: var(--ink); }
        .segment-highlight { position: absolute; left: 0; bottom: -1px; height: 3px; background: var(--primary); transition: transform .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1); }

        /* ---------- Records ---------- */
        .rec-head, .rec-row { display: grid; align-items: center; column-gap: 16px; grid-template-columns: 120px 1fr 1fr 1.5fr; }
        .rec-list.with-user .rec-head, .rec-list.with-user .rec-row { grid-template-columns: 110px 1.3fr 1fr 1fr 1.5fr; }
        .rec-head { padding: 12px 0; border-bottom: 1px solid var(--ink); }
        .rec-row { position: relative; min-height: 60px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 15px; transition: background-color .15s; }
        .rec-row:hover { background: var(--tile); }
        .rec-row.is-today::before { content: ""; position: absolute; left: -20px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; border: 1.5px solid var(--ink); box-sizing: border-box; }
        .rec-row.is-today.live::before { background: var(--primary); border-color: var(--primary); }
        .rec-date { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
        .rec-date small { margin-left: 8px; color: var(--ink-3); font-family: var(--font-sans); font-size: 12px; }
        .rec-time { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
        .rec-time.empty { color: var(--ink-3); }
        .rec-user { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
        .rec-dur { display: flex; align-items: center; gap: 14px; font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
        .rec-dur .bar { flex: 1; height: 2px; background: var(--rule); overflow: hidden; }
        .rec-dur .bar i { display: block; height: 100%; background: var(--ink); }
        .rec-row.live .rec-dur { color: var(--primary); }
        .rec-row.live .rec-dur .bar i { background: var(--primary); }
        .rec-dur span { min-width: 64px; text-align: right; }
        @media (max-width: 560px) {
            .rec-head, .rec-row { grid-template-columns: 64px 1fr 1fr 64px; column-gap: 8px; }
            .rec-list.with-user .rec-head, .rec-list.with-user .rec-row { grid-template-columns: 50px 1fr 50px 50px 58px; column-gap: 8px; }
            .rec-date, .rec-time, .rec-dur { font-size: 16px; }
            .rec-dur .bar, .rec-date small { display: none; }
            .rec-dur span { min-width: 0; margin-left: auto; }
            .rec-row.is-today::before { left: -12px; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--rule); }

        /* ---------- Dialogs ---------- */
        .ios-backdrop { background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
        .ios-backdrop.active { opacity: 1; pointer-events: auto; }
        .ios-modal { transform: translateY(10px); opacity: 0; transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
        .ios-backdrop.active .ios-modal { transform: none; opacity: 1; }
        .dialog { background: var(--bg); border-top: 4px solid var(--primary); }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            15% { opacity: 1; transform: translateY(0) scale(1.05); }
            25% { opacity: 1; transform: translateY(0) scale(1); }
            85% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-15px) scale(0.95); }
        }
        .sequence-text-anim { animation: slideUpFade 1.2s ease-in-out forwards; }
        #sequenceText { font-family: var(--font-fable); font-style: italic; font-weight: 600 !important; letter-spacing: -0.01em !important; color: #fff3dc !important; text-shadow: 0 0 24px rgba(255, 170, 60, .7); -webkit-text-stroke: 0 !important; }

        /* 휴게 선택 */
        .break-ctl { display: inline-flex; align-items: center; gap: 12px; }
        .break-ctl .opts { display: inline-flex; border: 1px solid rgba(255,255,255,.28); }
        .break-ctl button { font-family: var(--font-display); font-size: 14px; font-weight: 500; padding: 5px 12px; color: rgba(255,255,255,.65); transition: background-color .15s, color .15s; }
        .break-ctl button + button { border-left: 1px solid rgba(255,255,255,.28); }
        .break-ctl button:hover { color: #fff; }
        .break-ctl button[aria-pressed="true"] { background: #fff; color: #16120e; }

        .view-section { display: none; opacity: 0; transition: opacity .3s ease; }
        .view-section.active { display: flex; opacity: 1; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition-duration: 0s !important; }
        }
    </style>
</head>

    <canvas id="friendsCanvas" aria-hidden="true"></canvas>

    <!-- ============ AUTH ============ -->
    <main id="authView" class="view-section active relative z-10 w-full max-w-[1200px] min-h-full flex-col md:flex-row p-4 md:p-8 gap-4 md:gap-6">
        <section class="hero md:flex-1 flex flex-col justify-between p-8 md:p-12 min-h-[300px] md:min-h-0" data-state="working">
            <div class="lanterns" data-count="22"></div>
            <div class="display text-[22px] font-medium">check-on<span class="dot ml-0.5"></span></div>
            <div>
                <h1 class="fable text-[60px] md:text-[96px] leading-[0.9]">Clock in,<br>light a lantern.</h1>
                <p class="text-[15px] text-white/60 mt-5">출근하면 오늘의 등불이 하나 떠오릅니다.</p>
            </div>
        </section>

        <section class="w-full md:w-[420px] flex flex-col justify-center py-6 md:px-6">
            <div class="flex items-center justify-between mb-10">
                <h2 class="display text-[36px] font-normal leading-none">로그인</h2>
                <span id="authBadge" class="badge">Local</span>
            </div>

            <div class="space-y-5 mb-8">
                <label class="block">
                    <span class="field-label">아이디</span>
                    <input type="text" id="emailInput" placeholder="발급받은 아이디" autocomplete="username" autocapitalize="off" spellcheck="false" class="apple-input">
                </label>
                <label class="block">
                    <span class="field-label">비밀번호</span>
                    <input type="password" id="passwordInput" placeholder="6자 이상" autocomplete="current-password" class="apple-input">
                </label>
            </div>

            <div class="flex flex-col gap-3">
                <button id="btnLogin" class="btn btn-solid w-full h-14 text-[16px]">
                    <span>로그인</span>
                    <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
                </button>
                <button id="btnSignup" class="btn btn-line btn-center w-full h-14">회원가입</button>
            </div>
        </section>

    <!-- ============ APP ============ -->
    <div id="appView" class="view-section relative z-10 w-full max-w-[1200px] flex-col px-4 md:px-8">

        <header class="flex items-center justify-between h-20">
            <div class="display text-[22px] font-medium">check-on<span class="dot ml-0.5"></span></div>
            <div class="flex items-center gap-6">
                <button id="btnFriends" class="link-btn text-[var(--ink-2)]" aria-pressed="true" title="배경 친구들 켜기/끄기">
                    <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true" style="color:var(--pink)"><use href="#flower" width="20" height="20"/></svg>
                    <span>친구들</span>
                </button>
                <span id="currentUserEmail" class="display text-[16px] text-[var(--ink-2)]"></span>
                <button id="btnLogout" class="link-btn">
                    로그아웃
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
                </button>
            </div>
        </header>

        <!-- Today -->
        <section class="grid md:grid-cols-3 gap-4 md:gap-6">
            <div id="heroBlock" class="hero md:col-span-2 p-6 md:p-10 flex flex-col min-h-[420px]" data-state="idle">
                <div class="lanterns" data-count="16"></div>
                <div class="flex items-center justify-between gap-4">
                    <span id="liveDate" class="eyebrow">Loading</span>
                    <span id="workStatus" class="status" data-state="idle">출근 전</span>
                </div>

                <div id="liveClock" class="mt-10 md:mt-14">00:00</div>

                <div class="mt-auto pt-12">
                    <div class="flex items-baseline justify-between mb-4">
                        <div class="flex items-baseline gap-4">
                            <span id="workLabel" class="eyebrow">오늘 근무</span>
                            <span id="workTime" class="num text-[28px] font-normal">0h 00m</span>
                        </div>
                        <span id="workGoal" class="text-[13px] text-white/50">목표 8h</span>
                    </div>
                    <div class="track"><div id="workBar" class="track-fill" data-state="idle"></div></div>
                    <div class="ticks" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
                    <div class="flex flex-wrap items-center justify-between gap-3 mt-6">
                        <div class="break-ctl">
                            <span class="eyebrow">휴게</span>
                            <div class="opts" role="group" aria-label="휴게 시간">
                                <button type="button" data-break="30" aria-pressed="false">30분</button>
                                <button type="button" data-break="60" aria-pressed="true">1시간</button>
                            </div>
                        </div>
                        <span id="workGross" class="num text-[13px] text-white/50">경과 0h 00m</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col">
                <button id="btnClockIn" class="btn btn-solid cta flex-1">
                    <svg class="cta-emblem" aria-hidden="true"><use href="#sunEmblem"/></svg>
                    <svg class="cta-flowers" aria-hidden="true" preserveAspectRatio="none"><use href="#flower" x="18" y="62%" width="16" height="16"/><use href="#flower" x="44%" y="14" width="11" height="11"/><use href="#flower" x="30%" y="78%" width="13" height="13"/></svg>
                    <span class="cta-top"><span class="cta-kicker">Clock in</span><span class="btn-meta clock-meta">--:--</span></span>
                    <span class="cta-bottom">
                        <span class="btn-label">출근하기</span>
                        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" aria-hidden="true"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
                    </span>
                </button>
                <button id="btnClockOut" class="btn btn-solid cta flex-1" style="display:none">
                    <svg class="cta-emblem" aria-hidden="true"><use href="#sunEmblem"/></svg>
                    <svg class="cta-flowers" aria-hidden="true" preserveAspectRatio="none"><use href="#flower" x="18" y="62%" width="16" height="16"/><use href="#flower" x="44%" y="14" width="11" height="11"/><use href="#flower" x="30%" y="78%" width="13" height="13"/></svg>
                    <span class="cta-top"><span class="cta-kicker">Clock out</span><span class="btn-meta clock-meta">--:--</span></span>
                    <span class="cta-bottom">
                        <span class="btn-label">퇴근하기</span>
                        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" aria-hidden="true"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
                    </span>
                </button>
            </div>

            <dl class="kv md:col-span-3">
                <div><dt>출근</dt><dd id="statIn" class="muted">--:--</dd></div>
                <div><dt>퇴근</dt><dd id="statOut" class="muted">--:--</dd></div>
                <div><dt>이번 주</dt><dd id="statWeek">0h 00m</dd></div>
            </dl>
        </section>

        <!-- Records -->
        <section class="pt-16 md:pt-20 pb-20">
            <h2 class="display text-[40px] md:text-[48px] font-normal leading-none mb-6">기록</h2>
            <div class="flex items-end justify-between border-b border-[var(--rule)] mb-2">
                <div class="segmented-control" id="tabs" role="tablist">
                    <div class="segment-highlight" id="tabHighlight"></div>
                    <button class="segment-btn active" data-target="tabMyRecords" role="tab">나의 기록</button>
                    <button class="segment-btn" data-target="tabAllRecords" role="tab">전체 직원</button>

            <div id="tabMyRecords" class="tab-content active">

                    <div id="myRecordsBody" class="overflow-y-auto custom-scrollbar max-h-[600px] pl-5 -ml-5"></div>
                </div>

                    <div id="allRecordsBody" class="overflow-y-auto custom-scrollbar max-h-[600px] pl-5 -ml-5"></div>
                </div>
                <p id="allEmptyState" class="hidden py-16 text-[15px] text-[var(--ink-2)]">등록된 기록이 없습니다.</p>
            </div>
        </section>
    </div>

        const allRecordsBody = document.getElementById('allRecordsBody');
        const currentUserEmailEl = document.getElementById('currentUserEmail');
        
        // Modals
        const alertModal = document.getElementById('alertModal');
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');
        const btnAlertOk = document.getElementById('btnAlertOk');
        
        const confirmModal = document.getElementById('confirmModal');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmMessage = document.getElementById('confirmMessage');
        let confirmActionCallback = null;

        // State variables
        const LOCAL_AUTH_KEY = 'apple_tracker_current_user';
        const LOCAL_DATA_PREFIX = 'apple_tracker_data_';
        let currentUser = null; 

        // Supabase Auth는 이메일만 받으므로, 아이디를 내부용 가짜 이메일로 변환한다.
        const ID_EMAIL_DOMAIN = 'attendance.app';
        // 회원가입 허용 여부 (계정은 관리자가 미리 생성). 다시 열려면 true로 변경
        const ALLOW_SIGNUP = false;

        const ID_PATTERN = /^[a-z0-9_.-]{3,20}$/;

        function readCredentials() {
            const id = document.getElementById('emailInput').value.trim().toLowerCase();

            if (!id || !password) { showAlert('오류', '아이디와 비밀번호를 입력해주세요.'); return null; }
            if (!ID_PATTERN.test(id)) { showAlert('오류', '아이디는 영문 소문자·숫자·_ . - 조합 3~20자로 입력해주세요.'); return null; }
            if (password.length < 6) { showAlert('오류', '비밀번호는 6자 이상이어야 합니다.'); return null; }
            return { id, email: idToEmail(id), password };
        }
        let isProcessing = false;

        // Custom Alert Function
        function showAlert(title, message) {
            alertTitle.innerHTML = title;
            alertMessage.innerHTML = message;
            alertModal.classList.add('active');
        }
        btnAlertOk.onclick = () => alertModal.classList.remove('active');

        // Custom Confirm Function

        };

        // Clock Update
        const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('liveClock').innerHTML = `${hours}<span class="colon">:</span>${minutes}<span class="sec">${seconds}</span>`;
            document.getElementById('liveDate').textContent =
                `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} · ${WEEKDAYS[now.getDay()]}요일`;
            document.querySelectorAll('.clock-meta').forEach(el => el.textContent = `${hours}:${minutes}`);
        }
        setInterval(updateClock, 1000); updateClock();

        // 떠오르는 등불
        function spawnLanterns(container) {
            const count = Number(container.dataset.count) || 14;
            const rise = (container.parentElement.offsetHeight || 600) + 120;
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const el = document.createElement('span');
                el.className = 'lantern';
                const w = 6 + Math.random() * 10;               // 멀리 있는 등불은 작고 흐리게
                el.style.left = `${Math.random() * 96}%`;
                el.style.setProperty('--w', `${w.toFixed(1)}px`);
                el.style.setProperty('--o', (0.35 + (w - 6) / 10 * 0.65).toFixed(2));
                el.style.setProperty('--dur', `${(34 - w * 1.2 + Math.random() * 8).toFixed(1)}s`);
                el.style.setProperty('--delay', `${(-Math.random() * 30).toFixed(1)}s`);
                el.style.setProperty('--sway', `${(Math.random() * 40 - 20).toFixed(0)}px`);
                el.style.setProperty('--rise', `${rise}px`);
                container.appendChild(el);
            }
        }
        function refreshLanterns() { document.querySelectorAll('.lanterns').forEach(spawnLanterns); }
        let lanternResizeTimer;
        window.addEventListener('resize', () => { clearTimeout(lanternResizeTimer); lanternResizeTimer = setTimeout(refreshLanterns, 300); });

        // 오늘 근무시간 (출근 후 실시간 경과, 퇴근 시 확정)
        const WORK_GOAL_MIN = 8 * 60;
        const DEFAULT_BREAK_MIN = 60;
        const BREAK_AFTER_MIN = 4 * 60; // 경과 4시간 이후부터 휴게 차감

        // 휴게시간: DB의 breakMin 컬럼 우선, 없으면 브라우저에 저장한 값, 그것도 없으면 1시간
        function breakStoreKey() { return 'apple_tracker_break_' + (currentUser ? currentUser.id : 'anon'); }
        function readBreakMap() {
            try { return JSON.parse(localStorage.getItem(breakStoreKey()) || '{}'); } catch (e) { return {}; }
        }
        function getBreakMin(record, date) {
            if (record && Number.isFinite(record.breakMin)) return record.breakMin;
            if (record && currentUser && record.user_id !== currentUser.id) return DEFAULT_BREAK_MIN; // 남의 기록엔 내 로컬 설정 적용 안 함
            const saved = readBreakMap()[date || (record && record.date)];
            return Number.isFinite(saved) ? saved : DEFAULT_BREAK_MIN;
        }
        // 실근무 = 경과시간에서 휴게 차감 (4시간 전까지는 차감 없음, 휴게 구간 동안은 4시간에 머무름)
        function netMinutes(grossMin, breakMin) {
            if (grossMin <= BREAK_AFTER_MIN) return grossMin;
            return Math.max(BREAK_AFTER_MIN, grossMin - breakMin);
        }

        async function setTodayBreak(min) {
            const today = getTodayStr();
            const map = readBreakMap();
            map[today] = min;
            try { localStorage.setItem(breakStoreKey(), JSON.stringify(map)); } catch (e) {}
            if (todayRecord) {
                todayRecord.breakMin = min;
                if (isSupabaseActive && todayRecord.id) {
                    const { error } = await sb.from('attendance').update({ breakMin: min }).eq('id', todayRecord.id);
                    if (error) console.warn('breakMin 저장 실패 (DB 컬럼 확인 필요). 브라우저에만 저장됩니다.', error.message);
                } else if (!isSupabaseActive) {
                    const localData = JSON.parse(localStorage.getItem(LOCAL_DATA_PREFIX + currentUser.id) || '{}');
                    if (localData[today]) { localData[today].breakMin = min; localStorage.setItem(LOCAL_DATA_PREFIX + currentUser.id, JSON.stringify(localData)); }
                }
            }
            updateWorkTime();
            fetchMyRecords();
            if (document.querySelector('[data-target="tabAllRecords"]').classList.contains('active')) fetchAllRecords();
        }
        document.querySelectorAll('.break-ctl [data-break]').forEach(btn => {
            btn.addEventListener('click', () => setTodayBreak(Number(btn.dataset.break)));
        });
        let todayRecord = null;
        let weekBaseMin = 0; // 이번 주(월~) 오늘 제외 완료분 합계

        function minutesBetween(a, b) {
            return Math.max(0, Math.floor((new Date(b) - new Date(a)) / 60000));
        }
        function formatDuration(min) {
            return `${Math.floor(min / 60)}h ${String(min % 60).padStart(2, '0')}m`;
        }
        function formatHM(ts) {
            if (!ts) return '--:--';
            const d = new Date(ts);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function updateWorkTime() {
            let todayMin = 0;
            let grossMin = 0;
            let state = 'idle';
            const breakMin = getBreakMin(todayRecord, getTodayStr());
            if (todayRecord && todayRecord.clockIn) {
                state = todayRecord.clockOut ? 'done' : 'working';
                grossMin = minutesBetween(todayRecord.clockIn, todayRecord.clockOut || new Date());
                todayMin = netMinutes(grossMin, breakMin);
            }
            document.getElementById('heroBlock').dataset.state = state;
            document.querySelectorAll('.break-ctl [data-break]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.break) === breakMin)));
            const deducted = grossMin - todayMin;
            const breakLabel = breakMin === 60 ? '1시간' : `${breakMin}분`;
            document.getElementById('workGross').textContent =
                state === 'idle' ? `휴게 ${breakLabel}은 4시간 경과 후 차감`
                : grossMin <= BREAK_AFTER_MIN ? `경과 ${formatDuration(grossMin)} · 휴게 ${breakLabel}은 4시간 이후 차감`
                : `경과 ${formatDuration(grossMin)} · 휴게 −${formatDuration(deducted)}`;

            const statusEl = document.getElementById('workStatus');
            statusEl.dataset.state = state;
            statusEl.textContent = { idle: '출근 전', working: '근무 중', done: '퇴근 완료' }[state];

            document.getElementById('workTime').textContent = formatDuration(todayMin);
            const remain = WORK_GOAL_MIN - todayMin;
            // 퇴근 예정 = 출근 + 8시간 + 휴게 → 휴게를 바꾸면 바로 반영됨
            const expectedOut = state !== 'idle' ? new Date(new Date(todayRecord.clockIn).getTime() + (WORK_GOAL_MIN + breakMin) * 60000) : null;
            document.getElementById('workGoal').textContent =
                state === 'idle' ? `목표 8h · 휴게 ${breakLabel}`
                : state === 'done' ? (remain > 0 ? `목표까지 ${formatDuration(remain)} 부족` : `+${formatDuration(-remain)} 초과`)
                : remain > 0 ? `퇴근 예정 ${formatHM(expectedOut)} · 남은 ${formatDuration(remain)}` : `+${formatDuration(-remain)} 초과`;
            const bar = document.getElementById('workBar');
            bar.dataset.state = state;
            bar.style.width = `${Math.min(100, (todayMin / WORK_GOAL_MIN) * 100)}%`;

            const statIn = document.getElementById('statIn');
            const statOut = document.getElementById('statOut');
            statIn.textContent = formatHM(todayRecord && todayRecord.clockIn);
            statOut.textContent = formatHM(todayRecord && todayRecord.clockOut);
            statIn.classList.toggle('muted', state === 'idle');
            statOut.classList.toggle('muted', state !== 'done');
            document.getElementById('statWeek').textContent = formatDuration(weekBaseMin + todayMin);

            // 상태에 맞는 버튼 하나만 노출 (퇴근 후에는 퇴근 시각 재기록 가능)
            const btnIn = document.getElementById('btnClockIn');
            const btnOut = document.getElementById('btnClockOut');
            btnIn.style.display = state === 'idle' ? '' : 'none';
            btnOut.style.display = state === 'idle' ? 'none' : '';
            btnOut.classList.toggle('btn-solid', state === 'working');
            btnOut.classList.toggle('btn-line', state === 'done');
            if (!btnOut.dataset.flash) {
                btnOut.querySelector('.btn-label').textContent = state === 'done' ? '퇴근 시각 다시 기록' : '퇴근하기';
            }
        }
        setInterval(updateWorkTime, 1000);

        const segmentBtns = document.querySelectorAll('.segment-btn');
        const tabHighlight = document.getElementById('tabHighlight');
        const tabContents = document.querySelectorAll('.tab-content');

        function updateTabHighlight(btn) {
            tabHighlight.style.width = `${btn.offsetWidth}px`;
            tabHighlight.style.transform = `translateX(${btn.offsetLeft}px)`;
        }

        segmentBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                segmentBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateTabHighlight(btn);
                
                tabContents.forEach(tc => tc.classList.remove('active'));
                document.getElementById(btn.dataset.target).classList.add('active');
                
                if(btn.dataset.target === 'tabAllRecords') fetchAllRecords();
                else fetchMyRecords();
            });
        });
        
        // Initialize highlight position
        window.addEventListener('load', () => updateTabHighlight(document.querySelector('.segment-btn.active')));
        window.addEventListener('resize', () => updateTabHighlight(document.querySelector('.segment-btn.active')));

        function switchView(viewName) {
            Object.values(views).forEach(v => {
                v.classList.remove('active');
                setTimeout(() => { if(!v.classList.contains('active')) v.style.display = 'none'; }, 400);
            });
            views[viewName].style.display = 'flex';
            setTimeout(() => {
                views[viewName].classList.add('active');
                views[viewName].querySelectorAll('.lanterns').forEach(spawnLanterns);
                if(viewName === 'app') updateTabHighlight(document.querySelector('.segment-btn.active'));
            }, 10);
        }

        async function initAuth() {
            if (isSupabaseActive) {
                const { data: { session } } = await sb.auth.getSession();
                if (session) loginSuccess(session.user);
                else switchView('auth');

                // 토큰 자동 갱신/다른 탭 로그아웃 반영
                sb.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_OUT') {
                        currentUser = null;
                        switchView('auth');
                    } else if (session && currentUser) {
                        currentUser = session.user;
                    }
                });
            } else {
                const localUser = localStorage.getItem(LOCAL_AUTH_KEY);
                if (localUser) loginSuccess(JSON.parse(localUser));
                else switchView('auth');
            }
        }

        function loginSuccess(user) {
            currentUser = user;
            const displayId = user.email.split('@')[0];
            currentUserEmailEl.textContent = displayId;
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
            switchView('app');
            fetchMyRecords();
        }

        document.getElementById('btnLogin').onclick = async () => {
            const cred = readCredentials();
            if (!cred) return;

            if(isSupabaseActive) {
                const { data, error } = await sb.auth.signInWithPassword({ email: cred.email, password: cred.password });
                if(error) showAlert('로그인 실패', error.message === 'Invalid login credentials' ? '아이디 또는 비밀번호가 올바르지 않습니다.' : error.message);
                else loginSuccess(data.user);
            } else {
                const dummyUser = { id: 'u_' + cred.id, email: cred.email };
                localStorage.setItem(LOCAL_AUTH_KEY, JSON.stringify(dummyUser));
                loginSuccess(dummyUser);
            }
        };

        document.getElementById('btnSignup').onclick = async () => {
            if (!ALLOW_SIGNUP) return;
            const cred = readCredentials();
            if (!cred) return;

            if(isSupabaseActive) {
                const { data, error } = await sb.auth.signUp({ email: cred.email, password: cred.password });
                if(error) showAlert('가입 실패', error.message === 'User already registered' ? '이미 사용 중인 아이디입니다.' : error.message);
                else if(data.session) loginSuccess(data.user);
                else showAlert('가입 확인 필요', 'Supabase에서 이메일 인증이 켜져 있어 로그인할 수 없습니다.<br>대시보드에서 Confirm email 옵션을 꺼주세요.');
            } else {
                showAlert('가입 완료 (로컬)', '로컬 환경 계정이 생성되었습니다.');
                const dummyUser = { id: 'u_' + cred.id, email: cred.email };
                localStorage.setItem(LOCAL_AUTH_KEY, JSON.stringify(dummyUser));
                loginSuccess(dummyUser);
            }
        };

        document.getElementById('passwordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btnLogin').click();
        });

        document.getElementById('btnLogout').onclick = async () => {
            if(isSupabaseActive) await sb.auth.signOut();
            else localStorage.removeItem(LOCAL_AUTH_KEY);
            currentUser = null;
            todayRecord = null;
            updateWorkTime();
            switchView('auth');
        };

        function formatTimeBadge(ts) {
            if (!ts) return '<span class="rec-time empty">—</span>';
            return `<span class="rec-time">${formatHM(ts)}</span>`;
        }
        
        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        async function fetchMyRecords() {
            let records = [];
            if (isSupabaseActive) {
                const { data, error } = await sb.from('attendance').select('*').eq('user_id', currentUser.id).order('date', {ascending: false});
                if(!error && data) records = data;
            } else {
                const localData = localStorage.getItem(LOCAL_DATA_PREFIX + currentUser.id);
                const parsed = localData ? JSON.parse(localData) : {};
                records = Object.values(parsed).sort((a,b) => b.date.localeCompare(a.date));
            }
            renderTable(records, myRecordsBody, document.getElementById('myEmptyState'), false);
            const todayStr = getTodayStr();
            todayRecord = records.find(r => r.date === todayStr) || null;
            const monday = new Date(); monday.setHours(0, 0, 0, 0);
            monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
            const mondayStr = `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
            weekBaseMin = records
                .filter(r => r.date >= mondayStr && r.date < todayStr && r.clockIn && r.clockOut)
                .reduce((sum, r) => sum + netMinutes(minutesBetween(r.clockIn, r.clockOut), getBreakMin(r)), 0);
            updateWorkTime();
        }

        async function fetchAllRecords() {
            let records = [];
            if (isSupabaseActive) {
                const { data, error } = await sb.from('attendance').select('*').order('date', {ascending: false});
                if(!error && data) records = data;
            } else {
                for (let i=0; i<localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith(LOCAL_DATA_PREFIX)) {
                        const parsed = JSON.parse(localStorage.getItem(key));
                        records.push(...Object.values(parsed));
                    }
                }
                records.sort((a,b) => b.date.localeCompare(a.date));
            }
            renderTable(records, allRecordsBody, document.getElementById('allEmptyState'), true);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        const BAR_SCALE_MIN = 10 * 60; // 행 막대 기준 10시간

        function renderTable(records, listEl, emptyStateEl, showEmail) {
            listEl.innerHTML = '';
            const listWrap = listEl.closest('.rec-list');
            if(records.length === 0) {
                emptyStateEl.classList.remove('hidden');
                listWrap.classList.add('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            listWrap.classList.remove('hidden');

            const todayStr = getTodayStr();
            records.forEach(r => {
                const [y, m, d] = r.date.split('-').map(Number);
                const weekday = WEEKDAYS[new Date(y, m - 1, d).getDay()];
                const isToday = r.date === todayStr;
                const live = isToday && r.clockIn && !r.clockOut;
                const min = r.clockIn && (r.clockOut || live) ? netMinutes(minutesBetween(r.clockIn, r.clockOut || new Date()), getBreakMin(r)) : null;

                const row = document.createElement('div');
                row.className = 'rec-row' + (isToday ? ' is-today' : '') + (live ? ' live' : '');

                const dateCell = `<div class="rec-date">${String(m).padStart(2, '0')}.${String(d).padStart(2, '0')}<small>${isToday ? '오늘' : weekday}</small></div>`;
                const name = showEmail ? escapeHtml((r.email || '').split('@')[0]) : '';
                const userCell = showEmail ? `<div class="rec-user" title="${name}">${name}</div>` : '';
                const durCell = min === null
                    ? `<div class="rec-dur"><span class="bar"></span><span class="rec-time empty">—</span></div>`
                    : `<div class="rec-dur"><span class="bar"><i style="width:${Math.min(100, (min / BAR_SCALE_MIN) * 100)}%"></i></span><span>${formatDuration(min)}</span></div>`;
                row.innerHTML = `${dateCell}${userCell}${formatTimeBadge(r.clockIn)}${formatTimeBadge(r.clockOut)}${durCell}`;
                listEl.appendChild(row);
            });
        }

        async function saveRecord(type) {
            const today = getTodayStr();
            const ts = Date.now();
            let currentRecord = { date: today, user_id: currentUser.id, email: currentUser.email, clockIn: null, clockOut: null };

            // Find existing record for today
            if (isSupabaseActive) {
                const { data } = await sb.from('attendance').select('*').eq('user_id', currentUser.id).eq('date', today).single();
                if (data) currentRecord = data;
            } else {
                const localData = JSON.parse(localStorage.getItem(LOCAL_DATA_PREFIX + currentUser.id) || '{}');
                if (localData[today]) currentRecord = localData[today];
            }

            if (type === 'IN') {
                if(currentRecord.clockIn) {
                    showAlert('알림', '이미 오늘 출근 기록이 있습니다.');
                    return false;
                }
                currentRecord.clockIn = ts;
            } else if (type === 'OUT') {
                currentRecord.clockOut = ts;
            }

            // Save
            if (isSupabaseActive) {
                // Determine if we need to insert or update based on if we fetched an existing id. 
                // Using upsert with match is best, but simplest is upsert based on PK if setup, or check ID.
                let query = sb.from('attendance');
                if (currentRecord.id) {
                    await query.update({ clockIn: currentRecord.clockIn, clockOut: currentRecord.clockOut }).eq('id', currentRecord.id);
                } else {
                    // Try inserting, if it fails due to PK conflict, we would upsert. We'll just insert/upsert.
                    await query.upsert({ 
                        user_id: currentRecord.user_id, 
                        email: currentRecord.email, 
                        date: currentRecord.date, 
                        clockIn: currentRecord.clockIn, 
                        clockOut: currentRecord.clockOut 
                    });
                }
            } else {
                const localData = JSON.parse(localStorage.getItem(LOCAL_DATA_PREFIX + currentUser.id) || '{}');
                localData[today] = currentRecord;
                localStorage.setItem(LOCAL_DATA_PREFIX + currentUser.id, JSON.stringify(localData));
            }

            fetchMyRecords();
            if(document.querySelector('[data-target="tabAllRecords"]').classList.contains('active')){
                fetchAllRecords();
            }
            return true;
        }

        // Animations
        let confettiAnim;
        function fireConfetti() {
            const duration = 3500; const end = Date.now() + duration;
            const golds = ['#f2b33d', '#ffcf70', '#f3a6c0', '#c9b3ec', '#fff1c9'];
            (function frame() {
                confetti({
                    particleCount: 2, angle: 90, spread: 70, startVelocity: 12,
                    gravity: -0.35, drift: (Math.random() - 0.5) * 0.8, decay: 0.97, ticks: 420,
                    origin: { x: Math.random(), y: 1.05 }, shapes: ['square'], scalar: 1.4, colors: golds
                });
                if (Date.now() < end) confettiAnim = requestAnimationFrame(frame);
            }());
        }

        async function triggerCelebration() {
            const photoModal = document.getElementById('photoModal');
            const textContainer = document.getElementById('sequenceTextContainer');
            const seqText = document.getElementById('sequenceText');
            
            photoModal.classList.add('active');
            fireConfetti();
            textContainer.style.opacity = '1';
            
            const msgs = ["IUSM", "I luv U", "화이팅"];
            for (let msg of msgs) {
                seqText.textContent = msg;
                seqText.style.animation = 'none';
                seqText.offsetHeight; // reflow
                seqText.classList.add('sequence-text-anim');
                await new Promise(r => setTimeout(r, 1200));
                seqText.classList.remove('sequence-text-anim');
            }

            textContainer.style.opacity = '0';
            photoModal.classList.remove('active');
            cancelAnimationFrame(confettiAnim);
        }

        document.getElementById('btnClockIn').onclick = () => {
            if (isProcessing) return;
            const now = new Date();
            const timeStr = `<span class="t-strong">"${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}"</span>`;
            
            showConfirm('출근 확인', `출근 등록하시겠습니까?<br>현재 시간 ${timeStr} 으로 기록됩니다.`, async () => {
                isProcessing = true;
                const success = await saveRecord('IN');
                if (success) await triggerCelebration();
                isProcessing = false;
            });
        };

        document.getElementById('btnClockOut').onclick = () => {
            if (isProcessing) return;
            const now = new Date();
            const timeStr = `<span class="t-strong">"${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}"</span>`;
            
            showConfirm('퇴근 확인', `퇴근 등록하시겠습니까?<br>현재 시간 ${timeStr} 으로 기록됩니다.`, async () => {
                isProcessing = true;
                const success = await saveRecord('OUT');
                if (success) {
                    const btn = document.getElementById('btnClockOut');
                    btn.dataset.flash = '1';
                    btn.querySelector('.btn-label').textContent = '저장됨';
                    setTimeout(() => { delete btn.dataset.flash; updateWorkTime(); }, 1500);
                }
                isProcessing = false;
            });
        };

        // 배경 친구들 토글
        const btnFriends = document.getElementById('btnFriends');
        function syncFriendsButton() {
            let on = true;
            try { on = localStorage.getItem('checkon_friends') !== '0'; } catch (e) {}
            btnFriends.setAttribute('aria-pressed', String(on));
            btnFriends.style.opacity = on ? '1' : '.45';
        }
        btnFriends.onclick = () => {
            const next = btnFriends.getAttribute('aria-pressed') !== 'true';
            try { localStorage.setItem('checkon_friends', next ? '1' : '0'); } catch (e) {}
            syncFriendsButton();
            window.dispatchEvent(new Event('friends:toggle'));
        };
        syncFriendsButton();

        // Bootstrap App
        initAuth();

    </script>

    <!-- 배경 친구들: 분홍 퍼프볼 + 검은 아기 용 (three.js) -->
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

        const canvas = document.getElementById('friendsCanvas');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const STORAGE_KEY = 'checkon_friends';
        const isEnabled = () => { try { return localStorage.getItem(STORAGE_KEY) !== '0'; } catch (e) { return true; } };

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        } catch (e) {
            canvas.remove();
            throw e;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
        camera.position.set(0, 0, 20);
        scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6d4f95, 1.7));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
        keyLight.position.set(4, 8, 10);
        scene.add(keyLight);

        const toon = color => new THREE.MeshToonMaterial({ color });
        const flat = (color, opts = {}) => new THREE.MeshBasicMaterial({ color, ...opts });
        function blob(r, material, sx = 1, sy = 1, sz = 1, seg = 24) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75)), material);
            m.scale.set(sx, sy, sz);
            return m;
        }

        // ---------- 분홍 퍼프볼 ----------
        function makePuff() {
            const g = new THREE.Group();
            const body = new THREE.Group();
            g.add(body);
            const pink = toon(0xf7a8c4);
            body.add(blob(1, pink, 1, 1, 1, 40));
            const mouth = blob(1, flat(0x7a1f3d), 0.07, 0.05, 0.03, 12);
            mouth.position.set(0, -0.1, 0.99);
            body.add(mouth);
            g.userData.arms = [];
            g.userData.feet = [];
            for (const s of [-1, 1]) {
                const eye = blob(1, flat(0x1a1030), 0.11, 0.26, 0.06, 16);
                eye.position.set(s * 0.24, 0.18, 0.95);
                const shine = blob(0.045, flat(0xffffff), 1, 1, 1, 8);
                shine.position.set(s * 0.24, 0.31, 1.0);
                const blush = blob(1, flat(0xff6f9f, { transparent: true, opacity: 0.65 }), 0.16, 0.08, 0.03, 16);
                blush.position.set(s * 0.52, -0.03, 0.86);
                blush.lookAt(s * 1.6, -0.03, 2.6);
                const arm = blob(0.3, pink, 1, 0.8, 0.9);
                arm.position.set(s * 0.93, -0.1, 0.1);
                const foot = blob(0.5, toon(0xd63a6b), 1.05, 0.55, 1.3);
                foot.position.set(s * 0.45, -0.92, 0.05);
                body.add(eye, shine, blush, arm);
                g.add(foot);
                g.userData.arms.push(arm);
                g.userData.feet.push(foot);
            }
            g.userData.body = body;
            return g;
        }

        // ---------- 검은 아기 용 ----------
        function makeWing(material) {
            // 날개: Y축이 바깥(스팬), X축이 앞뒤(코드). 뒷날은 물결 모양
            const s = new THREE.Shape();
            s.moveTo(0.45, 0);
            s.quadraticCurveTo(0.7, 1.3, -0.1, 2.5);
            s.quadraticCurveTo(-0.35, 2.0, -0.55, 2.05);
            s.quadraticCurveTo(-0.6, 1.5, -0.9, 1.45);
            s.quadraticCurveTo(-0.9, 0.85, -1.15, 0.7);
            s.quadraticCurveTo(-1.0, 0.3, -1.0, 0);
            s.lineTo(0.45, 0);
            const mesh = new THREE.Mesh(new THREE.ShapeGeometry(s, 12), material);
            const pivot = new THREE.Group();
            pivot.add(mesh);
            return pivot;
        }

        function makeDragon() {
            const g = new THREE.Group();
            const black = toon(0x1f1b28);
            const wingMat = new THREE.MeshToonMaterial({ color: 0x2a2436, side: THREE.DoubleSide });
            g.add(blob(1, black, 1.35, 0.72, 0.75, 32));
            const head = blob(0.62, black, 1.15, 0.92, 1, 32);
            head.position.set(1.45, 0.42, 0);
            const snout = blob(0.4, black, 1.1, 0.7, 0.9);
            snout.position.set(1.95, 0.3, 0);
            g.add(head, snout);
            g.userData.wings = [];
            for (const s of [-1, 1]) {
                const eye = blob(0.2, flat(0x9be34f), 1, 1.1, 0.5, 20);
                eye.position.set(1.62, 0.6, s * 0.48);
                const pupil = blob(0.2, flat(0x0b0a10), 0.25, 0.8, 0.3, 12);
                pupil.position.set(1.67, 0.6, s * 0.56);
                const shine = blob(0.045, flat(0xffffff), 1, 1, 1, 8);
                shine.position.set(1.58, 0.72, s * 0.58);
                const ear = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.75, 10), black);
                ear.position.set(1.05, 0.98, s * 0.28);
                ear.rotation.set(s * -0.4, 0, 1.15);
                const ear2 = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.4, 8), black);
                ear2.position.set(1.3, 0.95, s * 0.42);
                ear2.rotation.set(s * -0.6, 0, 1.0);
                g.add(eye, pupil, shine, ear, ear2);
                for (const x of [-0.6, 0.6]) {
                    const leg = blob(0.22, black, 1, 1.2, 1);
                    leg.position.set(x, -0.62, s * 0.4);
                    g.add(leg);
                }
                const wing = makeWing(wingMat);
                wing.position.set(0.15, 0.45, s * 0.3);
                wing.userData.side = s;
                g.add(wing);
                g.userData.wings.push(wing);
            }
            const tail = [];
            for (let i = 0; i < 7; i++) {
                const seg = blob(0.34 * (1 - i * 0.1), black, 1.2, 0.9, 0.9, 16);
                seg.position.set(-1.25 - i * 0.42, 0.05, 0);
                g.add(seg);
                tail.push(seg);
            }
            const finShape = new THREE.Shape();
            finShape.moveTo(0, 0); finShape.lineTo(-0.7, 0.45); finShape.lineTo(-0.55, 0); finShape.lineTo(-0.7, -0.45); finShape.lineTo(0, 0);
            const fin = new THREE.Mesh(new THREE.ShapeGeometry(finShape), wingMat);
            fin.rotation.x = Math.PI / 2;
            const finRed = new THREE.Mesh(new THREE.ShapeGeometry(finShape), new THREE.MeshToonMaterial({ color: 0xb8323a, side: THREE.DoubleSide }));
            finRed.rotation.x = Math.PI / 2;
            finRed.scale.set(0.85, 0.85, 1);
            finRed.position.z = 0.02;
            const finGroup = new THREE.Group();
            finGroup.add(fin, finRed);
            g.add(finGroup);
            g.userData.tail = tail;
            g.userData.fin = finGroup;
            return g;
        }

        const puff = makePuff();
        const dragon = makeDragon();
        scene.add(puff, dragon);

        // ---------- 화면 크기 → 월드 좌표 ----------
        let viewW = 1, viewH = 1, unit = 1;
        function resize() {
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            viewH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
            viewW = viewH * camera.aspect;
            unit = viewH / h; // 1px 의 월드 크기
            const small = w < 640;
            puff.scale.setScalar((small ? 24 : 32) * unit);
            dragon.scale.setScalar((small ? 20 : 28) * unit);
        }
        window.addEventListener('resize', resize);
        resize();

        // ---------- 움직임 ----------
        const puffState = { x: -viewW * 0.3, dir: 1, hop: 0, lookY: 0 };
        const prevDragon = new THREE.Vector3();
        let dragonYaw = 0;
        const SWOOP_EVERY = 14, SWOOP_LEN = 5;
        const smooth = t => t * t * (3 - 2 * t);

        function update(t, dt) {
            // 퍼프볼: 화면 아래를 통통 튀며 왕복
            const halfW = viewW / 2 - puff.scale.x * 1.6;
            const swoopPhase = (t % SWOOP_EVERY) / SWOOP_LEN;
            const swooping = swoopPhase < 1;
            const excite = swooping ? Math.sin(swoopPhase * Math.PI) : 0;

            puffState.x += puffState.dir * dt * (1.1 + excite * 0.8) * puff.scale.x;
            if (puffState.x > halfW) { puffState.x = halfW; puffState.dir = -1; }
            if (puffState.x < -halfW) { puffState.x = -halfW; puffState.dir = 1; }
            puffState.hop += dt * (3.2 + excite * 2.2);
            const k = Math.abs(Math.sin(puffState.hop));
            const groundY = -viewH / 2 + puff.scale.y * 1.5;
            puff.position.set(puffState.x, groundY + k * puff.scale.y * (0.9 + excite * 1.1), 2);
            const body = puff.userData.body;
            body.scale.set(1 + 0.1 * (1 - k), 1 - 0.12 * (1 - k) + 0.05 * k, 1 + 0.1 * (1 - k));
            puff.userData.arms.forEach((arm, i) => { arm.rotation.z = (i ? 1 : -1) * (0.3 + Math.sin(puffState.hop * 2) * (0.35 + excite * 0.5)); });
            puffState.lookY += ((puffState.dir * 0.5) - puffState.lookY) * Math.min(1, dt * 4);
            puff.rotation.y = puffState.lookY;

            // 용: 화면 위쪽을 8자로 날다가, 주기적으로 퍼프볼 주위를 빙글빙글
            const patrol = new THREE.Vector3(
                Math.sin(t * 0.23) * viewW * 0.38,
                viewH * 0.18 + Math.sin(t * 0.46) * viewH * 0.12,
                Math.sin(t * 0.31) * 1.5
            );
            const a = t * 2.2;
            const orbit = new THREE.Vector3(
                puff.position.x + Math.cos(a) * puff.scale.x * 3.2,
                puff.position.y + puff.scale.y * (2.4 + Math.sin(a * 2) * 0.5),
                2 + Math.sin(a) * 1.4
            );
            const w = swooping ? smooth(Math.min(1, swoopPhase * 3, (1 - swoopPhase) * 3)) : 0;
            dragon.position.lerpVectors(patrol, orbit, w);

            const vel = dragon.position.clone().sub(prevDragon);
            prevDragon.copy(dragon.position);
            if (Math.abs(vel.x) > 1e-4) {
                const target = vel.x > 0 ? -0.35 : Math.PI + 0.35;
                let diff = target - dragonYaw;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                dragonYaw += diff * Math.min(1, dt * 3);
            }
            dragon.rotation.y = dragonYaw;
            dragon.rotation.z = THREE.MathUtils.clamp(vel.y / Math.max(dt, 1e-3) * 0.08, -0.4, 0.4) * (Math.cos(dragonYaw) >= 0 ? 1 : -1);

            const flap = 0.35 + Math.sin(t * 9) * 0.65;
            dragon.userData.wings.forEach(wg => { wg.rotation.x = wg.userData.side * (Math.PI / 2 - flap); });
            dragon.position.y += Math.sin(t * 9 + 1.2) * 0.04 * dragon.scale.y * 10;
            dragon.userData.tail.forEach((seg, i) => {
                seg.position.y = 0.05 + Math.sin(t * 4 - i * 0.6) * 0.06 * i;
                seg.position.z = Math.sin(t * 3 - i * 0.5) * 0.04 * i;
            });
            const last = dragon.userData.tail[dragon.userData.tail.length - 1];
            dragon.userData.fin.position.set(last.position.x - 0.2, last.position.y, last.position.z);
        }

        // ---------- 루프 ----------
        const clock = new THREE.Clock();
        let running = false;
        function frame() {
            if (!running) return;
            const dt = Math.min(clock.getDelta(), 0.05);
            update(clock.elapsedTime, dt);
            renderer.render(scene, camera);
            requestAnimationFrame(frame);
        }
        function syncRunning() {
            const on = isEnabled();
            canvas.style.display = on ? '' : 'none';
            if (reduceMotion) {
                if (on) { update(3, 0.016); renderer.render(scene, camera); }
                return;
            }
            const shouldRun = on && !document.hidden;
            if (shouldRun && !running) { running = true; clock.getDelta(); requestAnimationFrame(frame); }
            if (!shouldRun) running = false;
        }
        document.addEventListener('visibilitychange', syncRunning);
        window.addEventListener('friends:toggle', syncRunning);
        syncRunning();
    </script>
